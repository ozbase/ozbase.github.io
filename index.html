<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>旅先チェック｜海外旅行の習慣・マナー早見表</title>
<meta name="description" content="旅先の習慣を国ごとに横並びで確認できる海外旅行向け早見表。チップ、水道水、鉄道、交通側、トイレなどを比較できます。">
<meta name="theme-color" content="#0b1020">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://ozbase.github.io/">
<style>
:root{color-scheme:dark;--bg:#080b12;--panel:#0f1522;--line:#263149;--text:#eef3fb;--muted:#9eabc0;--accent:#76a9ff;--danger:#ff8a8a;--r:16px}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans JP",sans-serif;background:linear-gradient(180deg,#0b1020 0,#080b12 34rem);color:var(--text);line-height:1.55}button,select,input{font:inherit}.wrap{width:min(1180px,calc(100% - 24px));margin:auto;padding:28px 0 48px}header{padding:12px 2px 24px}h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0}.sub{margin:8px 0 0;color:var(--muted);font-size:14px}.selector{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;background:rgba(15,21,34,.88);border:1px solid var(--line);border-radius:var(--r);padding:14px}.field label{display:block;color:var(--muted);font-size:12px;margin:0 0 5px}select,input{width:100%;background:#0a0f19;color:var(--text);border:1px solid #34415c;border-radius:11px;padding:11px 12px;outline:none}.actions{display:flex;justify-content:flex-end;margin-top:10px}.primary{border:0;background:var(--accent);color:#07101d;font-weight:800;border-radius:12px;padding:11px 18px;cursor:pointer}.note{margin:14px 0 0;padding:12px 14px;border:1px solid #3a4250;border-radius:12px;color:#cbd3df;background:rgba(255,255,255,.025);font-size:13px}.legend{display:flex;flex-wrap:wrap;gap:12px;margin:12px 2px;color:var(--muted);font-size:12px}.tableWrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:rgba(15,21,34,.9)}table{width:100%;min-width:760px;border-collapse:collapse;table-layout:fixed}th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:14px 13px;vertical-align:top;text-align:left}th:last-child,td:last-child{border-right:0}tr:last-child th,tr:last-child td{border-bottom:0}thead th{background:#111a2a;position:sticky;top:0;z-index:2}thead th:first-child,.rowhead{width:165px}.rowhead{background:#0d1420}.rowtitle{font-weight:750}.hint{display:block;color:var(--muted);font-size:11px;margin-top:3px}.country{font-weight:800}.fiction{display:inline-block;margin-left:6px;padding:2px 6px;border-radius:999px;border:1px solid #78621f;color:#ffe38b;font-size:10px}.cellMain{font-weight:700}.cellSub{color:var(--muted);font-size:12px;margin-top:4px}.unknown{color:#d8c27b}.danger{color:var(--danger)}.searchArea{margin-top:16px;display:grid;grid-template-columns:1fr auto;gap:10px;background:rgba(15,21,34,.88);border:1px solid var(--line);border-radius:var(--r);padding:14px}.searchArea p{grid-column:1/-1;margin:0;color:var(--muted);font-size:12px}.searchBtn,.mini{border:1px solid #3b4b68;background:#121a2a;color:var(--text);border-radius:11px;padding:10px 14px;cursor:pointer}.mini{padding:5px 8px;font-size:11px;margin-top:7px}.ad{height:92px;margin-top:16px;border:1px dashed #364158;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#6f7b91;font-size:12px}.searchArea+ .ad{min-height:92px}footer{margin-top:22px;color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap}footer a{color:#aebbd0}@media(max-width:760px){.selector{grid-template-columns:1fr 1fr}.selector .field:nth-child(3),.selector .field:nth-child(4){display:none}.searchArea{grid-template-columns:1fr}.searchArea p{grid-column:auto}.searchBtn{width:100%}.tableWrap{overflow-x:hidden}table{min-width:0;table-layout:fixed}thead th:first-child,.rowhead{width:34%}th,td{padding:11px 8px;overflow-wrap:anywhere}.country{font-size:14px}.cellMain{font-size:13px}.cellSub{font-size:11px}.hint{font-size:10px}.mini{padding:5px 7px}.actions{grid-column:1/-1!important}}@media(max-width:460px){.selector{grid-template-columns:1fr 1fr}h1{font-size:32px}}
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"旅先チェック","alternateName":"Travel Check","url":"https://ozbase.github.io/","description":"海外旅行の習慣・マナーを国ごとに比較できる早見表"}</script>
</head>
<body><div class="wrap">
<header><h1>🌍 旅先チェック</h1><p class="sub">旅先習慣早見表</p></header>
<section class="selector" aria-label="国の選択">
<div class="field"><label for="c0">選択国 1</label><select id="c0"></select></div>
<div class="field"><label for="c1">選択国 2</label><select id="c1"></select></div>
<div class="field"><label for="c2">選択国 3</label><select id="c2"></select></div>
<div class="field"><label for="c3">選択国 4</label><select id="c3"></select></div>
<div class="actions" style="grid-column:1/-1"><button class="primary" id="compare" type="button">比較する</button></div>
</section>
<div class="note">掲載内容は各国の日常習慣の「あらまし」です。地域・施設・時期で異なる場合があります。法律や禁止事項に関わる内容は、渡航前に現地の最新情報をご確認ください。</div>
<div class="legend"><span>⭕ 必要・する</span><span>❌ 不要・しない</span><span>✅ 可能・OK</span><span>⚠️ 注意</span><span>未確認 = 推測で埋めない</span></div>
<div class="tableWrap"><table id="compareTable"><thead></thead><tbody></tbody></table></div>
<section class="searchArea"><p>詳しく調べたい時だけ検索。項目の「検索語」を押すと、ここに入ります。</p><input id="q" aria-label="検索語" placeholder="例：台湾 トイレ料金 有料"><button class="searchBtn" id="search" type="button">Googleで検索</button></section>
<div class="ad" aria-label="広告枠">広告枠</div>
<footer><span>旅先チェック</span><a href="privacy.html">プライバシー</a><span>最終更新 2026-09</span></footer>
</div>
<script>
(() => {
const rows=[
 {key:'bag',label:'買い物袋',hint:'マイバッグの使い方',query:'買い物 マイバッグ 会計前'},
 {key:'tip',label:'チップ',hint:'必要か・目安はいくらか',query:'チップ レストラン ホテル ベッドメイク 目安'},
 {key:'water',label:'水道水',hint:'そのまま飲めるか',query:'水道水 飲める'},
 {key:'esc',label:'エスカレーター',hint:'立ち方・歩行',query:'エスカレーター 立つ側'},
 {key:'train',label:'鉄道',hint:'時刻表どおり動くか',query:'鉄道 遅延 定時性'},
 {key:'traffic',label:'交通側',hint:'車が走る側',query:'左側通行 右側通行'},
 {key:'toilet',label:'トイレ',hint:'紙の扱い・トイレ料金',query:'トイレットペーパー トイレ料金 有料 無料'}
];
const U={text:'未確認 ⚠️',cls:'unknown'};
const toilet=(text,sub='',fee='未確認 ⚠️')=>({text,sub:(sub?sub+'<br>':'')+'トイレ料金：'+fee});
const countries={
 jp:{name:'日本',data:{bag:{text:'支払い後に使用 ✅',sub:'会計前の商品を自分の袋へ入れない'},tip:{text:'基本不要 ❌'},water:{text:'飲める・軟水が多い ✅'},esc:{text:'歩かず立ち止まるのが基本',sub:'慣習は関東で左、関西で右が多い ⚠️'},train:{text:'定刻運行が多い ✅'},traffic:{text:'左側通行'},toilet:toilet('紙は流す ✅','紙：流す','ほぼ無料 ✅')}},
 kr:{name:'韓国',data:{bag:{text:'支払い後に使用 ✅'},tip:{text:'基本不要 ❌',sub:'レストラン・タクシーとも通常不要'},water:{text:'飲用可能 ✅',sub:'市販水や浄水器を使う人も多い'},esc:{text:'歩かず立つのが公式推奨',sub:'実際は右に立ち左を空ける人も多い ⚠️'},train:{text:'鉄道は比較的定刻'},traffic:{text:'右側通行'},toilet:toilet('施設差あり ⚠️','紙：施設差あり','無料が多い ✅')}},
 tw:{name:'台湾',data:{bag:{text:'支払い後に使用 ✅'},tip:{text:'基本不要 ❌',sub:'ホテル・レストランは10%サービス料の場合あり'},water:{text:'そのままの飲用は避ける ⚠️',cls:'danger',sub:'沸騰・浄水・市販水を利用'},esc:{text:'両側に立ってOK ✅',sub:'歩かず手すりにつかまり立つのを推奨'},train:{text:'鉄道は概ね時刻表運行'},traffic:{text:'右側通行'},toilet:toilet('施設差あり ⚠️','紙：流せる場所も増えている','無料が多い ✅')}},
 cn:{name:'中国',data:{bag:{text:'支払い後に使用 ✅'},tip:{text:'基本不要 ❌'},water:{text:'水道水の直接飲用は避ける ⚠️',cls:'danger'},esc:{text:'歩かず立つのを推奨',sub:'都市部で「片側を空ける」慣習から安全重視へ移行中 ⚠️'},train:{text:'高速鉄道は比較的定刻'},traffic:{text:'右側通行'},toilet:toilet('施設差が大きい ⚠️','紙：施設差あり','無料が多い・私設は有料もある ⚠️')}},
 th:{name:'タイ',data:{bag:{text:'支払い後に使用 ✅'},tip:{text:'場面による ⚠️',sub:'レストラン：サービス料なしなら約10%目安<br>ベッドメイク：約฿50/泊'},water:{text:'水道水の直接飲用は避ける ⚠️',cls:'danger'},esc:{text:'BTSでは右側を利用',sub:'手すりにつかまり安全優先 ⚠️'},train:{text:'路線・列車により遅延あり ⚠️'},traffic:{text:'左側通行'},toilet:toilet('施設差あり ⚠️','紙：配管が弱い場所では流さない場合あり','場所による・有料あり ⚠️')}},
 us:{name:'アメリカ',data:{bag:{text:'支払い後に使用 ✅'},tip:{text:'基本必要 ⭕',sub:'レストラン：15〜20%目安<br>ベッドメイク：$2〜5/泊'},water:{text:'多くの地域で飲用可能 ✅'},esc:{text:'右に立ち左を空けることが多い',sub:'地域・施設差あり ⚠️'},train:{text:'地域差が大きい ⚠️'},traffic:{text:'右側通行'},toilet:toilet('紙は流す ✅','紙：流す','無料が多い ⚠️')}},
 uk:{name:'イギリス',data:{bag:{text:'支払い後に使用 ✅'},tip:{text:'場面による ⚠️',sub:'レストラン：サービス料なしなら10〜15%<br>荷物：£2程度'},water:{text:'飲める ✅'},esc:{text:'右に立つ',sub:'ロンドン地下鉄では左側を歩行者用に空ける'},train:{text:'時刻表運行だが遅延・運休あり ⚠️'},traffic:{text:'左側通行'},toilet:toilet('紙は流す ✅','紙：流す','無料が多い・有料もある ⚠️')}},
 fr:{name:'フランス',data:{bag:{text:'支払い後に使用 ✅'},tip:{text:'追加は任意',sub:'レストラン：サービス込み・良ければ2〜3%程度<br>ベッドメイク：約€1.50/日'},water:{text:'飲める ✅'},esc:{text:'右に立ち左を空けることが多い',sub:'パリなど都市部の慣習 ⚠️'},train:{text:'概ね時刻表運行'},traffic:{text:'右側通行'},toilet:toilet('紙は流す ✅','紙：流す','無料・有料が混在 ⚠️')}},
 in:{name:'インド',data:{bag:{text:'支払い後に使用 ✅'},tip:{text:'場面による ⚠️',sub:'レストラン：サービス料なしなら5〜10%<br>ベッドメイク：₹50〜300/泊目安'},water:{text:'水道水の直接飲用は避ける ⚠️',cls:'danger'},esc:{text:'左に立ち右を空ける',sub:'都市鉄道で案内あり・地域差あり ⚠️'},train:{text:'遅延あり ⚠️'},traffic:{text:'左側通行'},toilet:toilet('施設差が大きい ⚠️','紙：流せない場所あり','場所による・有料あり ⚠️')}},
 nr:{name:'ナウル共和国',data:{bag:{text:'再利用バッグ可 ✅',sub:'使い捨てプラスチック買い物袋は禁止'},tip:{text:'基本不要 ❌'},water:{text:'一般的な水道網なし ⚠️',sub:'雨水・淡水化水を利用。地下水は飲用不可'},esc:U,train:{text:'旅客鉄道なし',sub:'旧鉄道はリン鉱石輸送用'},traffic:{text:'左側通行'},toilet:toilet('未確認 ⚠️','紙：未確認 ⚠️')}},
 na:{name:'ナルニア',fiction:true,extra:'馬車・船の描写あり',data:{bag:U,tip:U,water:U,esc:U,train:U,traffic:U,toilet:toilet('未確認 ⚠️','紙：未確認 ⚠️')}}
};
const order=['cn','fr','in','jp','kr','nr','na','tw','th','uk','us'];
const c0=document.getElementById('c0'),c1=document.getElementById('c1'),c2=document.getElementById('c2'),c3=document.getElementById('c3');
const compare=document.getElementById('compare'),q=document.getElementById('q'),search=document.getElementById('search');
function fillSelect(sel,required){sel.textContent='';if(!required){const x=document.createElement('option');x.value='';x.textContent='選択しない';sel.appendChild(x)}for(const k of order){const c=countries[k],o=document.createElement('option');o.value=k;o.textContent=c.name+(c.fiction?'（架空）':'');sel.appendChild(o)}}
fillSelect(c0,true);fillSelect(c1,false);fillSelect(c2,false);fillSelect(c3,false);c0.value='jp';c1.value='tw';c2.value='';c3.value='';
function render(){const mobile=window.matchMedia('(max-width:760px)').matches;const raw=mobile?[c0.value,c1.value]:[c0.value,c1.value,c2.value,c3.value];const keys=raw.filter(Boolean);const unique=[...new Set(keys)];const thead=document.querySelector('#compareTable thead');const tbody=document.querySelector('#compareTable tbody');thead.innerHTML='<tr><th>項目</th>'+unique.map(k=>{const c=countries[k];return '<th><span class="country">'+c.name+'</span>'+(c.fiction?'<span class="fiction">架空の国</span>':'')+(c.extra?'<span class="hint">'+c.extra+'</span>':'')+'</th>'}).join('')+'</tr>';tbody.innerHTML=rows.map(r=>'<tr><th class="rowhead"><span class="rowtitle">'+r.label+'</span><span class="hint">'+r.hint+'</span><button type="button" class="mini" data-query="'+r.query+'">検索語</button></th>'+unique.map(k=>{const d=countries[k].data[r.key]||U;return '<td><div class="cellMain '+(d.cls||'')+'">'+d.text+'</div>'+(d.sub?'<div class="cellSub">'+d.sub+'</div>':'')+'</td>'}).join('')+'</tr>').join('');document.querySelectorAll('.mini').forEach(b=>b.addEventListener('click',()=>{const first=unique[1]||unique[0];q.value=(countries[first]?.name||'')+' '+b.dataset.query;q.focus()}))}
compare.addEventListener('click',render);search.addEventListener('click',()=>{const s=q.value.trim();if(s)window.open('https://www.google.com/search?q='+encodeURIComponent(s),'_blank','noopener')});q.addEventListener('keydown',e=>{if(e.key==='Enter')search.click()});window.addEventListener('resize',render);render();
})();
</script>
</body></html>
